<!DOCTYPE html>
<html lang="es">
    <!--Vista 7: Tipo de envío -> Resumen de la operación-->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Entrenamiento - Transferencia Bancaria</title>
        <link rel="stylesheet" href="7-Tipo_envio/Tipo_envio.css" />
    </head>
    <body>
        <div class="maqueta">
            <!-- Imagen de fondo -->
            <img src="7-Tipo_envio/Tipo_envio.png" alt="Fondo del proceso" class="background"/>
            <div class="overlay">
                <!-- Botón de envío normal -->
                <div id="botonesTipoEnvio">
                    <div id="botonesEnvioNormal">
                        <button class="textoTipoEnvio" style="top: 61.65%; left: 29.3%;">
                            Envío normal  
                        </button>
                        <button class="textoEnvio" style="top: 62.65%; left: 29.3%;">
                            Llegará en un día hábil
                        </button>
                        <button class="botonGastosComisiones" style="top: 63.7%; left: 29.3%;">
                            <span class="info-par">
                                <span style="display: flex; gap: 4px; color: gray;">Gastos:</span>
                                <span style="color: black;">0,00€</span>
                            </span>
                            <span class="info-par">
                                <span style="display: flex; gap: 4px; color: gray;">| Comisiones:</span>
                                <span style="color: black;">0,00€</span>
                            </span>
                        </button>
                    </div>
                    <!-- Botón de envío inmediato-->
                    <div id="botonesEnvioInmediato">
                        <button class="textoTipoEnvio" style="top: 61.65%; left: 44.9%;">
                            Envío inmediato  
                        </button>
                        <button class="textoEnvio" style="top: 62.65%; left: 44.9%;">
                            Instantáneo (no podrás anularlo)
                        </button>
                        <button class="botonGastosComisiones" style="top: 63.7%; left: 44.9%;">
                            <span class="info-par">
                                <span style="display: flex; gap: 4px; color: gray;">Gastos:</span>
                                <span style="color: black;">0,00€</span>
                            </span>
                            <span class="info-par">
                                <span style="display: flex; gap: 4px; color: gray;">| Comisiones:</span>
                                <span style="color: black;">0,00€</span>
                            </span>
                        </button>
                    </div>
                </div>
                <!-- Botón de cambio de interfaz-->
                <button class="botonContinuar" style="top: 72.6%; left: 66%;" onclick="window.location.href='8-Resumen.html'">
                    Continuar
                </button>
                <!-- Flechas de indicación -->
                <div class="indicacion" style="top: 66%; left: 30%;">
                    <div class="flecha">↑</div>
                    <div class="texto">
                        <p>
                            Selecciona<br>
                            un tipo de<br>
                            envío<br>
                        </p>
                    </div>
                </div>
                <div class="indicacion" style="top: 66%; left: 46%;">
                    <div class="flecha">↑</div>
                    <div class="texto">
                        <p>
                            Selecciona<br>
                            un tipo de<br>
                            envío<br>
                        </p>
                    </div>
                </div>
            </div>
            <!--Script para el desplazamiento de la flecha de indicación-->
            <script src="7-Tipo_envio/desplazamiento.js"></script>
        </div>

</html>
